id: over-collecting-one-res
name: "Over-collecting one resource"
explanation: >
  An economy skewed too far onto one resource (all wood, no food; or all food, no gold) starves the
  units and upgrades you actually want. Balanced eco lets you produce continuously instead of
  bottlenecking on the resource you neglected.
severity: low
# heuristic: reads the MID-GAME worker-allocation share (#2 gathering intent) — a COUNT-based signal
# (how many workers on each resource), never a fabricated resource amount. Fires when one resource's
# worker share dominates mid-game. Estimate, not exact.
confidence_tier: heuristic

detector:
  fn: over_collecting_one_res
  inputs: [economy.worker_allocation.mid_game_share]
  params:
    max_share: 0.6
  condition: "any resource's mid-game worker share > max_share"

fix: >
  Match your villager distribution to what you're producing: enough food for villagers and units,
  enough gold for your military, enough wood for buildings and farms. Rebalance villagers (or use the
  market) when one resource stockpiles while another runs dry.

source:
  ref: "steam-noobs-guide-2993319677"
  detail: "Balance your eco to your production; don't over-collect one resource"
  study:
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=2993319677"
    title: "Steam Noobs guide — eco balance"

id: floating-resources
name: "Floating resources"
explanation: >
  Resources sitting in the bank do nothing — banked wood/food/gold that should be villagers,
  military, or upgrades is wasted potential, especially in Feudal where a few hundred floating wood
  often means a missed military building or eco upgrade.
severity: medium
# heuristic: the floating signal is the MID-GAME gap between gathering INTENT (worker-allocation
# share, #2) and near-exact SPENDING share (#3 cost tables) — NOT an absolute bank total (those stay
# suppressed; we never fabricate gathered/bank amounts). End-game float is normal and excluded.
confidence_tier: heuristic

detector:
  fn: floating_resources
  inputs: [economy.resource_balance.floating]
  params: {}
  condition: "economy.resource_balance.floating.flags is non-empty (a MID-GAME resource whose worker share exceeds its spend share)"

fix: >
  Spend as you collect: keep production buildings queuing, buy/sell at the market to rebalance, and
  add TCs or military rather than banking. A good habit is to glance at your resource bar and turn
  any large pile into something on the map.

source:
  ref: "steam-noobs-guide-2993319677"
  detail: "Don't float ~1000 wood; convert banked resources into units/upgrades"
  study:
    url: "https://steamcommunity.com/sharedfiles/filedetails/?id=2993319677"
    title: "Steam Noobs guide — don't float resources"

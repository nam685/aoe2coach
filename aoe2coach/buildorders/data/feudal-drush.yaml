  - { phase: dark_age, task: "Barracks ~22 pop, make 3 Militia, send to harass" }
  - { phase: dark_age, task: "Click to Feudal while militia raid" }
  - { phase: feudal,   task: "Add range/skirms or archers as the main army" }

whats_next:

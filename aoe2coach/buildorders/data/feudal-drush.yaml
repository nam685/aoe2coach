id: feudal-drush
name: "18 Vils Feudal Drush"
source:
  guide: "hera-strategy-guide-2025-04"
  page: 18
family: drush
recommended_civs: [Aztecs, Mayans, Incas, Ethiopians]
summary: >
  A dark-age Barracks producing 3 Militia to harass the opponent's economy, transitioning into a
  normal Feudal follow-up (archers or skirms). Distinct from MAA: militia are made in the DARK AGE
  and usually NOT upgraded to Man-at-Arms.

